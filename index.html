<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jpd - Ôn tập Từ vựng Tiếng Nhật Bài 4 - 7 (できる日本語)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4 font-sans">

    <!-- Header / Brand -->
    <div class="w-full max-w-4xl text-center mt-2 mb-1">
        <h1 class="text-3xl font-black text-blue-600 tracking-wider">jpd</h1>
    </div>

    <!-- Navigation -->
    <div class="w-full max-w-4xl flex justify-center gap-4 mb-4 mt-2">
        <button id="nav-quiz" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold shadow-md transition">Chức năng học</button>
        <button id="nav-list" class="px-6 py-2 bg-white text-blue-600 rounded-lg font-bold shadow-md hover:bg-blue-50 transition">Tất cả câu hỏi</button>
    </div>

    <!-- Lesson Filter Tabs -->
    <div class="w-full max-w-4xl flex justify-center gap-2 mb-2 flex-wrap" id="lesson-tabs">
        <button data-lesson="all" class="lesson-tab px-4 py-1.5 rounded-full font-bold text-sm shadow-sm transition border-2 border-indigo-500 bg-indigo-500 text-white">Tất cả</button>
        <button data-lesson="4" class="lesson-tab px-4 py-1.5 rounded-full font-bold text-sm shadow-sm transition border-2 border-indigo-300 bg-white text-indigo-600 hover:bg-indigo-50">Bài 4</button>
        <button data-lesson="5" class="lesson-tab px-4 py-1.5 rounded-full font-bold text-sm shadow-sm transition border-2 border-indigo-300 bg-white text-indigo-600 hover:bg-indigo-50">Bài 5</button>
        <button data-lesson="6" class="lesson-tab px-4 py-1.5 rounded-full font-bold text-sm shadow-sm transition border-2 border-indigo-300 bg-white text-indigo-600 hover:bg-indigo-50">Bài 6</button>
        <button data-lesson="7" class="lesson-tab px-4 py-1.5 rounded-full font-bold text-sm shadow-sm transition border-2 border-indigo-300 bg-white text-indigo-600 hover:bg-indigo-50">Bài 7</button>
    </div>

    <!-- Part Filter Tabs -->
    <div class="w-full max-w-4xl flex justify-center gap-2 mb-6 flex-wrap" id="part-tabs"></div>

    <!-- MÀN HÌNH CHỜ (Hiện lúc mới vào) -->
    <div id="loading-screen" class="text-center text-blue-600 font-bold text-xl my-8">
        Đang nạp dữ liệu câu hỏi...
    </div>

    <!-- MÀN HÌNH LÀM QUIZ -->
    <div id="quiz-screen" class="bg-white p-6 md:p-8 rounded-xl shadow-2xl w-full max-w-5xl hidden transition-all duration-300">
        <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-100">
            <div class="flex items-center gap-2 flex-wrap">
                <div class="text-sm text-white bg-blue-600 px-4 py-1.5 rounded-full font-bold shadow-sm tracking-wide" id="progress"></div>
                <div class="text-sm text-white bg-indigo-500 px-3 py-1.5 rounded-full font-bold shadow-sm" id="lesson-badge"></div>
            </div>
            <div class="text-xs text-gray-400 font-medium" id="quiz-subtitle">jpd • Tiếng Nhật Bài 4 - 7 (できる日本語)</div>
        </div>

        <!-- Toolbar Chế độ & Furigana -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6 bg-slate-50 p-2.5 md:p-3 rounded-xl border border-slate-200">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Chế độ hỏi:</span>
                <div class="inline-flex p-1 bg-white rounded-lg border border-gray-200 shadow-sm gap-1 flex-wrap">
                    <button class="quiz-mode-btn px-3 py-1.5 text-xs md:text-sm font-bold rounded-md transition" data-mode="jp-vi">
                        🇯🇵 ➔ 🇻🇳 Nhật - Việt
                    </button>
                    <button class="quiz-mode-btn px-3 py-1.5 text-xs md:text-sm font-bold rounded-md transition" data-mode="vi-jp">
                        🇻🇳 ➔ 🇯🇵 Việt - Nhật
                    </button>
                    <button class="quiz-mode-btn px-3 py-1.5 text-xs md:text-sm font-bold rounded-md transition" data-mode="mix">
                        🔀 Trộn cả hai
                    </button>
                </div>
            </div>
            
            <label class="flex items-center gap-1.5 cursor-pointer text-xs font-semibold text-gray-600 hover:text-blue-600 select-none bg-white hover:bg-blue-50 px-3 py-1.5 rounded-lg transition border border-gray-200 shadow-sm ml-auto">
                <input type="checkbox" id="toggle-furigana" class="w-4 h-4 accent-blue-600 rounded">
                <span>Ẩn cách đọc (chỉ hiện Hán tự)</span>
            </label>
        </div>
        
        <div class="flex flex-col md:flex-row gap-8">
            <!-- Cột trái: Câu hỏi và Phản hồi -->
            <div class="flex-1 md:w-1/2">
                <!-- Badge phân loại câu hỏi & Hướng câu hỏi -->
                <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
                    <span id="direction-badge" class="text-xs font-bold px-3 py-1 rounded-full inline-flex items-center gap-1 border"></span>
                    <div id="question-type-badge" class="text-xs font-bold px-2 py-1 bg-yellow-100 text-yellow-800 rounded inline-block hidden">MULTI-SELECT</div>
                </div>
                
                <h2 class="text-xl md:text-2xl font-bold text-gray-800 leading-relaxed whitespace-pre-wrap" id="question-text"></h2>
                
                <div id="feedback" class="mt-6 p-5 rounded-lg hidden">
                    <h3 id="feedback-title" class="font-bold text-lg mb-2"></h3>
                    <p id="feedback-text" class="text-base font-semibold opacity-90"></p>
                    <button id="next-btn" class="mt-5 w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow-md hover:bg-blue-700 transition">
                        Tiếp tục ➔
                    </button>
                </div>
            </div>

            <!-- Cột phải: Các đáp án -->
            <div class="flex-1 md:w-1/2 flex flex-col justify-between">
                <div id="options-container" class="space-y-3 mb-6"></div>

                <div class="flex gap-4">
                    <button id="skip-btn" class="w-full bg-gray-200 text-gray-800 py-4 rounded-lg font-bold text-lg hover:bg-gray-300 transition shadow-lg mt-auto">
                        Đổi câu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH DANH SÁCH -->
    <div id="list-screen" class="bg-white p-6 md:p-8 rounded-xl shadow-2xl w-full max-w-4xl hidden transition-all duration-300">
        <h2 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">Danh sách từ vựng (Bài 4 - 7)</h2>
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
            <div class="text-sm text-gray-600">
                Tổng số: <span id="total-questions" class="font-bold">0</span> câu. Bạn đã đánh dấu <span id="selected-count" class="font-bold text-blue-600">0</span> câu đã học.
            </div>
            <div class="flex gap-2 flex-wrap">
                <button id="scroll-last-btn" class="flex items-center gap-2 px-4 py-2 bg-amber-500 text-white rounded-lg font-bold shadow hover:bg-amber-600 active:scale-95 transition text-sm">
                    <span>📍</span>
                    <span>Câu đã học cuối</span>
                </button>
                <button id="select-all-btn" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg font-bold shadow hover:bg-blue-700 active:scale-95 transition text-sm">
                    <span>☑️</span>
                    <span>Chọn tất cả</span>
                </button>
                <button id="clear-all-btn" class="flex items-center gap-2 px-4 py-2 bg-gray-500 text-white rounded-lg font-bold shadow hover:bg-gray-600 active:scale-95 transition text-sm">
                    <span>🗑️</span>
                    <span>Bỏ chọn tất</span>
                </button>
            </div>
        </div>
        <div id="questions-list-container" class="space-y-6"></div>

        <!-- Nút Về đầu trang -->
        <button id="back-to-top-btn" title="Về đầu trang"
            class="hidden fixed bottom-6 right-6 z-50 w-12 h-12 bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center text-xl hover:bg-blue-700 active:scale-90 transition-all duration-200">
            ↑
        </button>
    </div>

    <!-- Scripts Module Hóa -->
    <script src="js/database.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
